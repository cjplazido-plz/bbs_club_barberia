name: barberflow
description: "App de control para barbería"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.3.4
  path_provider: ^2.1.1
  printing: ^5.12.0
  pdf: ^3.10.7
  connectivity_plus: ^5.0.2
  intl: ^0.20.3
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  fl_chart: ^1.2.0
  http: ^1.1.0
  url_launcher: ^6.3.3
  excel: ^4.0.6
  # --- IMPRESIÓN WINDOWS DIRECTA SOCKET (sin flutter_pos_printer_platform para evitar conflicto image 3.x) ---
  esc_pos_utils_plus: ^2.0.4
  image: ^4.3.0
  qr: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
