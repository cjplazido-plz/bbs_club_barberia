name: barberflow
description: Sistema POS para Barbería BBS Club
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  share_plus: ^9.0.0
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.0.0
  intl: ^0.20.3
  printing: ^5.11.0
  pdf: ^3.10.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  fl_chart: ^0.66.2
  excel: ^4.0.6
  table_calendar: ^3.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"