<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BBS CLUB - Barbería Premium">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BBS CLUB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>BBS CLUB - Barbería</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #312E81 100%);
      background-attachment: fixed;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #312E81 100%);
      z-index: 9999;
      transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo-container {
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .logo-box {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #6366F1, #818CF8);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 
        0 10px 30px rgba(99, 102, 241, 0.4),
        0 0 60px rgba(99, 102, 241, 0.2);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { 
        box-shadow: 
          0 10px 30px rgba(99, 102, 241, 0.4),
          0 0 60px rgba(99, 102, 241, 0.2);
        transform: scale(1);
      }
      50% { 
        box-shadow: 
          0 15px 40px rgba(99, 102, 241, 0.6),
          0 0 80px rgba(99, 102, 241, 0.3);
        transform: scale(1.05);
      }
    }

    .brand {
      margin-top: 24px;
      text-align: center;
    }

    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #6366F1, #818CF8, #A5B4FC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 2s linear infinite;
      background-size: 200% 100%;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .brand-subtitle {
      margin-top: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
      text-transform: uppercase;
    }

    .loader-dots {
      margin-top: 32px;
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6366F1;
      animation: bounce 1.4s ease-in-out infinite both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }

    @keyframes bounce {
      0%, 80%, 100% { 
        transform: scale(0.6);
        opacity: 0.5;
      }
      40% { 
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Oculta el canvas de Flutter hasta que cargue */
    flt-glass-pane {
      opacity: 0;
      animation: fadeInApp 0.6s ease-out 0.2s forwards;
    }

    @keyframes fadeInApp {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- LOADER PREMIUM - Reemplaza la pantalla blanca -->
  <div id="loading">
    <div class="logo-container">
      <div class="logo-box">💈</div>
    </div>
    <div class="brand">
      <div class="brand-title">BBS CLUB</div>
      <div class="brand-subtitle">Barbería Premium</div>
    </div>
    <div class="loader-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Oculta el loader cuando Flutter está listo
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 700);
      }
    });

    // Fallback: si por algún motivo no llega el evento, oculta después de 4s
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading && !loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 700);
      }
    }, 4000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
