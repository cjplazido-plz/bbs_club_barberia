<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BBS CLUB - Barberia Premium">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BBS CLUB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A0A0A">
  <style>html,body{background:#0A0A0A;}</style>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>BBS CLUB - Barberia</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; overflow: hidden; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, rgba(212,175,55,0.12) 0%, #0A0A0A 45%, #0A0A0A 100%);
      z-index: 9999; transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
    }
    #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .logo-container { position: relative; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    .logo-box {
      width: 230px; height: 230px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #000;
      box-shadow: 0 0 60px rgba(212,175,55,0.35), 0 10px 30px rgba(0,0,0,0.6);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 60px rgba(212,175,55,0.25), 0 10px 30px rgba(0,0,0,0.6); transform: scale(1); }
      50% { box-shadow: 0 0 90px rgba(212,175,55,0.45), 0 10px 30px rgba(0,0,0,0.6); transform: scale(1.02); }
    }
    .logo-box img { width: 100%; height: 100%; object-fit: cover; }
    /* Sin texto duplicado BBS CLUB abajo - el logo ya lo trae adentro */
    .loader-bar { margin-top: 40px; width: 130px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
    .loader-bar-fill { width: 40%; height: 100%; background: #D4AF37; animation: load 1.2s ease-in-out infinite alternate; border-radius: 2px; }
    @keyframes load { from { margin-left: 0; } to { margin-left: 60%; } }
    .loader-dots { margin-top: 26px; display: flex; gap: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #D4AF37; animation: bounce 1.4s ease-in-out infinite both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    .loading-text { margin-top: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; color: rgba(255,255,255,0.7); }
    .address { margin-top: 32px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; color: rgba(255,255,255,0.38); }
    flt-glass-pane { opacity: 0; animation: fadeInApp 0.6s ease-out 0.2s forwards; }
    @keyframes fadeInApp { to { opacity: 1; } }
  </style>
</head>
<body>
  <!-- LOADER PREMIUM LOGO UNICO V8 - un solo logo, sin texto duplicado -->
  <div id="loading">
    <div class="logo-container">
      <div class="logo-box">
        <img src="icons/Icon-512.png" alt="BBS CLUB Barberia" />
      </div>
    </div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <div class="loader-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="loading-text">Cargando...</div>
    <!-- <div class="address">Manuel Montt 460 - local 6 - Coronel</div>-->
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) { loading.classList.add('hidden'); setTimeout(() => loading.remove(), 700); }
    });
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading && !loading.classList.contains('hidden')) {
        loading.classList.add('hidden'); setTimeout(() => loading.remove(), 700);
      }
    }, 4000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
