<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BBS CLUB - Barbería Premium">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BBS CLUB">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>BBS CLUB - Barbería</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #312E81 100%);
      background-attachment: fixed;
      overflow: hidden;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #312E81 100%);
      z-index: 9999; transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
    }
    #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    
    .logo-container {
      position: relative;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    
    .logo-box {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4), 0 0 60px rgba(99, 102, 241, 0.2);
      animation: pulse-glow 2s ease-in-out infinite;
      overflow: hidden;
      border: 2px solid rgba(99, 102, 241, 0.3);
    }
    .logo-box img {
      width: 100%; height: 100%; object-fit: contain; padding: 10px;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4), 0 0 60px rgba(99, 102, 241, 0.2); transform: scale(1); }
      50% { box-shadow: 0 15px 40px rgba(99, 102, 241, 0.6), 0 0 80px rgba(99, 102, 241, 0.3); transform: scale(1.05); }
    }
    .brand { margin-top: 24px; text-align: center; }
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 24px; font-weight: 900; letter-spacing: 3px;
      background: linear-gradient(90deg, #6366F1, #818CF8, #A5B4FC);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; animation: shimmer 2s linear infinite; background-size: 200% 100%;
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .brand-subtitle {
      margin-top: 6px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px; letter-spacing: 4px; color: rgba(255,255,255,0.5); font-weight: 500; text-transform: uppercase;
    }
    .loader-dots { margin-top: 32px; display: flex; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6366F1; animation: bounce 1.4s ease-in-out infinite both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

    flt-glass-pane { opacity: 0; animation: fadeInApp 0.6s ease-out 0.2s forwards; }
    @keyframes fadeInApp { to { opacity: 1; } }
  </style>
</head>
<body>
  <!-- LOADER PREMIUM -->
  <div id="loading">
    <div class="logo-container">
      <div class="logo-box">
        <!-- Aquí usamos el logo real de la app -->
        <img src="icons/icon-192.png" alt="BBS CLUB" />
      </div>
    </div>
    <div class="brand">
      <div class="brand-title">BBS CLUB</div>
      <div class="brand-subtitle">Barbería Premium</div>
    </div>
    <div class="loader-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) { loading.classList.add('hidden'); setTimeout(() => loading.remove(), 700); }
    });
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading && !loading.classList.contains('hidden')) {
        loading.classList.add('hidden'); setTimeout(() => loading.remove(), 700);
      }
    }, 4000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
