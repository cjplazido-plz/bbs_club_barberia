<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BarberFlow POS - Sistema de gestión para barberías BBS Club F.C">
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#303f9f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BarberFlow">
  <meta name="application-name" content="BarberFlow POS">
  
  <!-- Viewport para móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>BarberFlow POS - BBS Club F.C</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Manifest para PWA -->
  <link rel="manifest" href="manifest.json">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a237e 0%, #303f9f 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    #splash-screen {
      text-align: center;
      color: white;
      animation: fadeIn 0.5s ease-in;
    }
    
    #splash-screen .logo {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    #splash-screen h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      font-weight: 600;
    }
    
    #splash-screen p {
      font-size: 14px;
      opacity: 0.8;
      margin: 0;
    }
    
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 24px auto 0;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    body.flutter-loaded #splash-screen {
      display: none;
    }
    
    #error-message {
      display: none;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      max-width: 400px;
    }
    
    #error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Splash Screen personalizado -->
  <div id="splash-screen">
    <div class="logo">✂️</div>
    <h1>BarberFlow POS</h1>
    <p>BBS Club F.C - Cargando...</p>
    <div class="loader"></div>
  </div>
  
  <!-- Mensaje de error -->
  <div id="error-message">
    <h2 style="color: #ff6b6b; margin-top: 0;">⚠️ Error al cargar</h2>
    <p id="error-text" style="color: white; margin-bottom: 16px;"></p>
    <button onclick="location.reload()" style="background: #4ecdc4; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;">
      🔄 Recargar
    </button>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      console.log('📄 Página cargada, inicializando Flutter...');
      
      // Verificar si flutter.js se cargó
      if (typeof _flutter === 'undefined') {
        console.error('❌ flutter.js no se cargó correctamente');
        showError('No se pudo cargar flutter.js. Verifica tu conexión a internet.');
        return;
      }
      
      // Cargar Flutter con manejo de errores
      try {
        _flutter.loader.load({
          onEntrypointLoaded: async function(engineInitializer) {
            console.log('✅ Entry point cargado, inicializando engine...');
            
            try {
              const appRunner = await engineInitializer.initializeEngine();
              console.log('✅ Engine inicializado, ejecutando app...');
              
              // Ocultar splash screen
              document.body.classList.add('flutter-loaded');
              
              // Ejecutar la app
              await appRunner.runApp();
              console.log('✅ App ejecutada correctamente');
            } catch (error) {
              console.error('❌ Error al inicializar engine:', error);
              showError('Error al inicializar la aplicación: ' + error.message);
            }
          }
        });
      } catch (error) {
        console.error('❌ Error al cargar Flutter:', error);
        showError('Error al cargar Flutter: ' + error.message);
      }
    });
    
    // Función para mostrar errores
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');
      errorText.textContent = message;
      errorDiv.classList.add('show');
    }
    
    // Prevenir zoom en móviles
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    document.addEventListener('dblclick', function(e) {
      e.preventDefault();
    });
    
    // Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('flutter_service_worker.js')
          .then(function(registration) {
            console.log('✅ Service Worker registrado:', registration.scope);
          })
          .catch(function(error) {
            console.log('⚠️ Service Worker no registrado:', error);
          });
      });
    }
  </script>
</body>
</html>
